[project]
name = "git_automation"
version = "0.0.0"
description = "Github meta repository, contains automation/workflows/standard configs used across my repositories."
readme = "README.md"
authors = [{ name = "Joe Harrison", email = "sudo-kraken@prxy.8shield.net" }]
requires-python = ">=3.11,<4.0.0"
dependencies = [
  "pulumi~=3.203.0",
  "pulumi-github~=6.7.0",
  "requests~=2.32.3",
  "Jinja2~=3.1.6",
  "PyYAML~=6.0.2",
]
keywords = ["pulumi", "github"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: CEA CNRS Inria Logiciel Libre License, version 2.1 (CeCILL-2.1)",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["ruff~=0.14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/git_automation"]
