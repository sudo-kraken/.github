[project]
name = "git_automation"
version = "1.0.0"
description = "Github meta repository, contains automation/workflows/standard configs used across my repositories."
readme = "README.md"
authors = [{ name = "Joe Harrison", email = "sudo-kraken@prxy.8shield.net" }]
requires-python = ">=3.11,<4.0.0"
dependencies = [
  "pulumi~=3.246.0",
  "pulumi-github~=6.15.0",
  "requests~=2.34.2",
  "Jinja2~=3.1.6",
]
keywords = ["pulumi", "github"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Topic :: Utilities",
]

[project.urls]
"Source Code" = "https://github.com/sudo-kraken/.github"
"Bug Tracker" = "https://github.com/sudo-kraken/.github/issues"

[project.optional-dependencies]
dev = [
  "PyYAML~=6.0.2",
  "pytest~=8.4.0",
  "pytest-cov~=7.0.0",
  "ruff~=0.15.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/git_automation"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
